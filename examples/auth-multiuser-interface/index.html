<!DOCTYPE html>
<html>

<head>
	<title>Gestor de Tiques Tarifarios Horarios</title>
	<meta charset="UTF-8">
	<link rel="icon" href="icon.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Gestor de Tiques Tarifarios Horarios.">
	<meta name="author" content="OKZGN">
	<meta name="theme-color" content="#004e9b">
	<link rel="stylesheet" href="style.css">
	<script src="https://cdn.jsdelivr.net/npm/estructura-js"></script>
	<script src="../../extensions/events/estructura.events.js"></script>
	<script src="../../extensions/dom/estructura.dom.js"></script>
	<script src="../../extensions/http/estructura.http.js"></script>
	<script src="../../extensions/routing/estructura.routing.js"></script>
	<script src="../../extensions/handlers/estructura.handlers.js"></script>
	<script>
	 _events(document).ready(function(){
			console.log('Estructura Handlers ready.');

			function concatUri(str, str2){
                var _lastSlash = str2.charAt(0) === '/';
                var _firstSlash = str.charAt(str.length - 1) === '/';

                if(!_lastSlash && !_firstSlash){
                  str2 = '/' + str2;
                }

                if(_lastSlash && _firstSlash){
                  str2 = str2.slice(1);
                }

                return str + str2;
			}

			var _e_handlers = {
              hideAccordions: function (event) {
                var id = this.initialElement.dataset.eHandlerId;
                for (var _id in _e_handlers.accordion) {
                  if (_e_handlers.accordion.hasOwnProperty(_id)) {
                    _e_handlers.accordion.call(_e_handlers.accordion[_id], {}, false);
                  }
                }
              },

              accordion: function (event, customAction) {
                var
                  element = _dom(this.liveElement),
                  target = _dom('>' + this.initialElement.dataset.eHandlerData),
                  elementAttr = 'data-selected',
                  targetAttr = 'data-hidden',
                  targetAttrVal = target.data(targetAttr),
                  targetAction = typeof customAction === 'undefined' ? !targetAttrVal[0] : customAction;

                if (targetAction) {
                  element.data(elementAttr, '');
                  target.data(targetAttr, 'no');
                  return;
                }

                element.data(elementAttr, 'no');
                target.data(targetAttr, '');
              },

              forms: function (event) {
                event.preventDefault();

                var
                  form = new FormData(this.liveElement),
                  formId = this.initialElement.dataset.eHandlerId,
                  formDataTarget = this.initialElement.dataset.eHandlerData,
                  formConnect = this.connect;

                if (!/\s*(http\:\/\/|https\:\/\/)/.test(formDataTarget)) {
                  var _pathname = window.location.pathname;
                  formDataTarget = concatUri(_pathname, formDataTarget);
                }

                try {
                  var _form = Object.fromEntries(form.entries());
                  _form.password = '*******';

                  console.info(this.initialElement.dataset.eHandlerData, _form);
                }
                catch (e) {
                  console.warn('_e_handlers:', e.message);
                }

                _http({
                  url: formDataTarget,
                  onSuccess: function (r) {
                    try {
                      r = JSON.parse(r);

                      if (!r || typeof r !== 'object') {
                        throw new Error('Response format not supported, Object required.');
                      }

                      if (typeof r.error !== 'undefined'){
                        throw new Error(r.error);
                      }

                      if (typeof r[formId] === 'undefined') {
                        throw new Error('Response requires Object."' + formId + '".');
                      }

                      if (typeof r[formId] === 'string') {
                        throw new Error(r[formId]);
                      }

                      if (!r[formId] || typeof r[formId] !== 'object'){
                        throw new Error('Response Object."' + formId + '" value required as Object.');
                      }

                      formConnect('success', r[formId]);
                    }
                    catch (e) {
                      if (typeof r.error !== 'undefined') {
                        e.message = r.error;
                      }

                      formConnect('error', e);
                    }
                  },
                  onError: function (r) {
                    formConnect('error', r);
                  }
                });
              },

              formsResponse: function (event) {
                event.preventDefault();

                var formsResponseId = this.initialElement.dataset.eHandlerId;
                console.log('formsResponse:', formsResponseId);
              },

              notification: function (event) {
                if (!this.initialElement || !this.liveElement) {
                  throw new Error(_e_handler_id_required);
                }

                var _element = _dom(this.initialElement);
                var element = _dom(this.liveElement);

                var _type = _e.type(event);
                if (_type['Error']) {
                  element.data('data-error', '');
                  element.set('textContent', event.message || 'Error.');
                }
                else if (_type['String']) {
                  element.data('data-error', '');
                  element.set('textContent', event);
                }
                else if (_type['Object']) {
                  if (event.loading) {
                    element.data('data-loading', '');
                    element.set('textContent', event.loading || event.message || 'Loading.');
                  }
                  else {
                    element.data('data-success', '');
                    element.set('textContent', event.success || event.message || 'Success.');
                  }
                }

                var _success = typeof this.liveElement.dataset.success !== 'undefined';
                var _error = typeof this.liveElement.dataset.error !== 'undefined';
                var _loading = typeof this.liveElement.dataset.loading !== 'undefined';

                if (_success || _error || _loading) {
                  element.data('data-hidden', 'no');
                  return;
                }

                element.data('data-hidden', '');
                element.set('textContent', _element.get('textContent')[0]);
              },

              remove: function (event) {
                if (!this.liveElement.isConnected) {
                  throw new Error('"' + this.initialElement.nodeName + '" Node is disconnected from DOM.');
                }

                this.liveElement.parentNode.removeChild(this.liveElement);
              },

              formsResponseRoute: function(event){
                if(
                  event && typeof event === 'object' &&
                  typeof event.success === 'string' &&
                  typeof event.token === 'string'
                ){
                  console.log('Received:', _routing.base(), event);
                  return;
                }

                throw new Error('Entry event/data required as Object.');
              },

              routes: function _routes_box(){
                _routing.start({
       			  click: false,
       			  dispatch: false
       			});

                var _base = window.location.pathname;
                console.log('Routes base:', _base);
       			_routing.base(_base);

                for(var route in _routes_box){
                  if (_routes_box.hasOwnProperty(route)) {
                    var _route = _routes_box[route].initialElement.dataset.eHandlerRoute;
                    if(_route){
                      console.log('Route:', concatUri(_base, _route));
                      //_routing(_route)
                    }
                  }
                }
              }
            };

            var _e_handlers_shortcuts = {
              'selectiveAccordion': ['hideAccordions', 'accordion'],
              'route': 'routes'
            };

			_handlers(_e_handlers, _e_handlers_shortcuts).start();
	});
	</script>
</head>

<body>
	<header>
		<h1><img src="icon.png" alt="Icon"><span>Gestor de Tiques Tarifarios Horarios</span></h1>
	</header>

	<main data-e-handler="routes" data-e-handler-id="routesBox" data-e-handler-end-start>
    	<div data-e-handler="route" data-e-handler-id="notSignedIn" data-e-handler-route="/">
    		<section>
    			<form
         			data-e-handler="forms"
         			data-e-handler-id="signup-form"
         			data-e-handler-event="submit"
         			data-e-handler-data="/auth/signup"

         			data-e-forms-connect="formsResponse.signup-form"

         			data-e-forms-response-error="notification.signup-notif"
         			data-e-forms-response-success="notification.signup-form"
    			>
     			<fieldset>
     			    <legend data-selected="no" data-e-handler="selectiveAccordion" data-e-handler-id="signup-header" data-e-handler-event="click" data-e-handler-data="#signup">Registro</legend>

        				<div id="signup" data-box data-hidden>
                            <div data-e-handler="notification" data-e-handler-id="signup-notif" data-hidden>Loading...</div>

            				<div>
            				    <h4>Tipo</h4>
                				<label data-flex-childs-center>
                				    <input type="radio" name="type" value="admin">
                				    <b>Administrador</b>
                				</label>
                				<label data-flex-childs-center>
                				    <input type="radio" name="type" value="operator" checked>
                				    <b>Operador</b>
                				</label>
            				</div>

            				<label data-flex-column>
            				    <h4>Usuario</h4>
         			        <input type="text" name="user">
            				</label>

            				<label data-flex-column>
            				    <h4>Contraseña</h4>
         			        <input type="password" name="password">
            				</label>

            				<label data-flex-column>
            				    <h4>Espacio de trabajo</h4>
         			        <input type="text" name="workspace">
            				</label>

            				<button type="submit">Registrar</button>
        				</div>
     			</fieldset>
    			</form>
    		</section>

    	    <section>
    			<form
         			data-e-handler="forms"
         			data-e-handler-id="signin-form"
         			data-e-handler-event="submit"
         			data-e-handler-data="/auth/signin"

         			data-e-forms-connect="formsResponse.signin-form"

         			data-e-forms-response-error="notification.signin-notif"
         			data-e-forms-response-success="notification.signin-notif, formsResponseRoute"
    			>
         			<fieldset>
         			    <legend data-e-handler="selectiveAccordion" data-e-handler-id="signin-header" data-e-handler-event="click" data-e-handler-data="#signin">Ingreso</legend>

        				<div id="signin" data-box data-hidden="no">
                            <div data-e-handler="notification" data-e-handler-id="signin-notif" data-hidden>Loading...</div>
            				<label data-flex-column>
            				    <h4>Usuario</h4>
         			        <input type="text" name="user">
            				</label>

            				<label data-flex-column>
            				    <h4>Contraseña</h4>
         			        <input type="password" name="password">
            				</label>

            				<label data-flex-column>
            				    <h4>Espacio de trabajo</h4>
         			            <input type="text" name="workspace">
            				</label>

            				<button type="submit">Ingresar</button>
        				</div>
         			</fieldset>
    			</form>
    		</section>
    	</div>

        <div data-e-handler="route" data-e-handler-id="signedIn" data-e-handler-route="/account">
            Signed in component.
        </div>
	</main>

	<footer>
	    <span>2026 &copy; Desarrollado y servido por <a href="https://okzgn.com">OKZGN</a>. Contacto: <a href="https://wa.me/593980670720">(+ 593) 098 067 0720</a></span>
	</footer>
</body>
</html>
